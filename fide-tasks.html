let activeType=0,activeSession=0,soundOn=true;
const KEY='fide-b1-task-practice-v1';
let state={done:{}};try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');if(x&&x.done)state=x}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function key(){return DATA[activeType].sessions[activeSession].id}
function shuffled(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function beep(ok){if(!soundOn)return;try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?660:180;g.gain.setValueAtTime(.055,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);o.start();o.stop(c.currentTime+.16)}catch(e){}}
function renderNav(){const tabs=document.getElementById('tabs');tabs.innerHTML='';DATA.forEach((t,i)=>{const b=document.createElement('button');b.className='tab'+(i===activeType?' active':'');const count=t.sessions.filter(s=>state.done[s.id]).length;b.textContent=`${t.icon} ${t.title} ${count}/5`;b.onclick=()=>{activeType=i;activeSession=0;render()};tabs.appendChild(b)});
 const ss=document.getElementById('sessions');ss.innerHTML='';DATA[activeType].sessions.forEach((s,i)=>{const b=document.createElement('button');b.className='sessionbtn'+(i===activeSession?' active':'')+(state.done[s.id]?' done':'');b.textContent=`${i+1}. ${s.title}`;b.onclick=()=>{activeSession=i;render()};ss.appendChild(b)});
 const total=DATA.flatMap(x=>x.sessions).length,done=Object.keys(state.done).filter(k=>state.done[k]).length;document.getElementById('overall').textContent=`${done}/${total} abgeschlossen`;document.getElementById('bar').style.width=`${done/total*100}%`}
function makeBlock(b){const el=document.createElement('div');el.className='block';el.draggable=true;el.dataset.id=b.id;el.dataset.order=b.order;const drag=document.createElement('div');drag.className='drag';drag.textContent='☰';el.appendChild(drag);const txt=document.createElement('div');txt.className='text';b.parts.forEach(p=>{if(p.type==='text')txt.append(document.createTextNode(p.text));else{const s=document.createElement('select');s.dataset.correct=p.correct;const blank=document.createElement('option');blank.value='';blank.textContent='…';s.appendChild(blank);shuffled(p.options).forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;s.appendChild(op)});txt.appendChild(s)}});el.appendChild(txt);const ctr=document.createElement('div');ctr.className='controls';const up=document.createElement('button');up.className='move';up.textContent='↑';up.onclick=()=>move(el,-1);const dn=document.createElement('button');dn.className='move';dn.textContent='↓';dn.onclick=()=>move(el,1);ctr.append(up,dn);el.appendChild(ctr);const st=document.createElement('div');st.className='status';el.appendChild(st);el.addEventListener('dragstart',e=>{el.classList.add('dragging');e.dataTransfer.setData('text/plain',b.id)});el.addEventListener('dragend',()=>el.classList.remove('dragging'));return el}
function move(el,dir){const p=el.parentElement;if(dir<0&&el.previousElementSibling)p.insertBefore(el,el.previousElementSibling);if(dir>0&&el.nextElementSibling)p.insertBefore(el.nextElementSibling,el);clearFeedback()}
function wireDnD(list){list.addEventListener('dragover',e=>{e.preventDefault();const moving=list.querySelector('.dragging');if(!moving)return;const sib=[...list.querySelectorAll('.block:not(.dragging)')];const next=sib.find(s=>e.clientY<=s.getBoundingClientRect().top+s.offsetHeight/2);next?list.insertBefore(moving,next):list.appendChild(moving)})}
function clearFeedback(){document.querySelectorAll('.block').forEach(b=>{b.classList.remove('order-good','order-bad');b.querySelector('.status').innerHTML=''});document.querySelectorAll('select').forEach(s=>s.classList.remove('good','bad'));const r=document.getElementById('result');if(r)r.classList.remove('show')}
function current(){return DATA[activeType].sessions[activeSession]}
function check(){const ex=current(),blocks=[...document.querySelectorAll('.block')];let orderCorrect=0,wordCorrect=0,totalWords=0;blocks.forEach((b,idx)=>{const orderOk=Number(b.dataset.order)===idx+1;if(orderOk)orderCorrect++;b.classList.add(orderOk?'order-good':'order-bad');let localC=0,localT=0;b.querySelectorAll('select').forEach(s=>{localT++;totalWords++;const ok=s.value===s.dataset.correct;if(ok){localC++;wordCorrect++;s.classList.add('good')}else{s.classList.add('bad')}});b.querySelector('.status').innerHTML=`<span class="badge ${orderOk?'good':'bad'}">Reihenfolge ${orderOk?'✓':'✗'}</span><span class="badge ${localC===localT?'good':'bad'}">Wörter ${localC}/${localT}</span>`});const all=orderCorrect===blocks.length&&wordCorrect===totalWords;beep(all);if(all){state.done[ex.id]=true;save()}renderNav();const r=document.getElementById('result');r.innerHTML=`<div class="score">${all?'Perfekt! 🎉':'Fast – prüfe nur die markierten Stellen.'}</div><div class="hint"><b>Wortwahl:</b> ${wordCorrect}/${totalWords} richtig · <b>Reihenfolge:</b> ${orderCorrect}/${blocks.length} Blöcke richtig platziert.</div>`;r.classList.add('show')}
function solution(){const ex=current(),box=document.getElementById('solution');const words=ex.blocks.flatMap(b=>b.parts.filter(p=>p.type==='select').map(p=>p.correct));box.innerHTML='<b>Richtige Reihenfolge:</b> '+[...ex.blocks].sort((a,b)=>a.order-b.order).map((b,i)=>`${i+1}. Block ${b.id.toUpperCase()}`).join(' → ')+'<br><br><b>Richtige Wortwahl:</b> '+words.join(' · ');box.classList.toggle('show')}
function renderExercise(){const ex=current(),m=document.getElementById('main');m.innerHTML='';const p=document.createElement('section');p.className='panel';const top=document.createElement('div');top.className='tasktop'+((ex.image||ex.scene)?' withimg':'');const left=document.createElement('div');left.innerHTML=`<div class="kicker">${DATA[activeType].icon} B1 · ${DATA[activeType].title}</div><h2>${ex.title}</h2><div class="subtitle2">${ex.subtitle}</div><div class="instruction">Wähle die passenden Wörter und ordne die vier grösseren Textblöcke. Die Reihenfolge und die Wortwahl werden getrennt bewertet.</div><div class="prompt"><b>Aufgabe:</b> ${ex.prompt}</div>`;top.appendChild(left);if(ex.image){const iw=document.createElement('div');iw.className='picwrap';iw.innerHTML=`<img alt="Bild zur FIDE-Übung" src="${ex.image}">`;top.appendChild(iw)}else if(ex.scene){const sc=document.createElement('div');sc.className='scene';sc.innerHTML=`<div class="emoji">${ex.scene.emoji}</div><strong>${ex.scene.title}</strong><p>${ex.scene.text}</p>`;top.appendChild(sc)}p.appendChild(top);const pr=document.createElement('div');pr.className='progressline';const n=ex.blocks.flatMap(b=>b.parts.filter(x=>x.type==='select')).length;pr.innerHTML=`<b>Baue den Text</b><span class="mini">4 Textblöcke · ${n} Wortentscheidungen · 1 klare Reihenfolge</span>`;p.appendChild(pr);const list=document.createElement('div');list.className='blocks';shuffled(ex.blocks).forEach(b=>list.appendChild(makeBlock(b)));wireDnD(list);p.appendChild(list);const a=document.createElement('div');a.className='actions';a.innerHTML='<button class="action primary" id="check">✓ Antworten prüfen</button><button class="action" id="sol">Lösung anzeigen</button><button class="action" id="reset">↻ Neu mischen</button><button class="action" id="sound">🔊 Sound</button>';p.appendChild(a);const r=document.createElement('div');r.id='result';r.className='result';p.appendChild(r);const s=document.createElement('div');s.id='solution';s.className='solution';p.appendChild(s);m.appendChild(p);document.getElementById('check').onclick=check;document.getElementById('sol').onclick=solution;document.getElementById('reset').onclick=renderExercise;document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 Sound':'🔇 Sound'}}
function render(){renderNav();renderExercise()}render();
</script>
